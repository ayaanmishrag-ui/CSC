<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

        /* नेविगेशन बार */
        .navbar {
            background-color: #0d6efd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
            font-weight: 500;
        }

        nav a.active {
            border-bottom: 2px solid white;
            padding-bottom: 3px;
        }

        /* हेडर और सर्च बार */
        .services-header {
            background-color: #e9ecef;
            padding: 30px 20px;
            text-align: center;
        }

        .services-header h1 {
            margin-bottom: 15px;
            color: #222;
            font-size: 24px;
        }

        .search-box {
            position: relative;
            max-width: 450px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 15px;
        }

        /* सर्विसेज ग्रिड */
        .container {
            padding: 30px 5%;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: white;
            padding: 25px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            text-align: center;
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .service-icon {
            font-size: 35px;
            color: #0d6efd;
            margin-bottom: 15px;
        }

        .service-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #333;
        }

        .service-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .btn-card {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-card:hover {
            background-color: #0b5ed7;
        }

        /* पॉप-अप फॉर्म (डिफ़ॉल्ट छिपा रहेगा) */
        .modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #444;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .payment-section {
            background-color: #f1f8ff;
            border: 1px dashed #0d6efd;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
        }

        .payment-section p {
            font-size: 13px;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .qr-code-img {
            width: 130px;
            height: 130px;
            border: 2px solid #fff;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .btn-submit {
            background-color: #198754;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 999;
        }

        footer {
            background-color: #212529;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

</head>

        </nav>
    </header>

    <!-- सर्विसेज हेडर और सर्च -->
    <section class="services-header">
        <h1>सभी ऑनलाइन प्रिंट और सरकारी सेवाएं</h1>
        <div class="search-box">
            <input type="text" id="searchInput" onkeyup="searchService()" placeholder="यहाँ अपनी सेवा खोजें (उदा. पैन, आधार, वोटर)...">
        </div>
    </section>

    <!-- सर्विसेज लिस्ट (जावास्क्रिप्ट द्वारा ऑटो-लोड होगी) -->
    <section class="container">
        <div class="service-grid" id="serviceGridContainer">
            <!-- सर्विसेज यहाँ लोड होंगी -->
        </div>
    </section>

    <!-- ऑनलाइन ऑर्डर और पेमेंट फॉर्म (Popup Modal) -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeOrderForm()">&times;</span>
            <h2 style="color: #0d6efd; text-align: center; margin-bottom: 15px;">ऑर्डर एवं आवेदन फॉर्म</h2>
            
            <form id="orderForm" onsubmit="submitToGoogleSheet(event)">
                <div class="form-group">
                    <label>चुनी गई सेवा:</label>
                    <input type="text" id="selectedService" readonly style="background-color: #e9ecef; font-weight: bold;">
                </div>

                <div class="form-group">
                    <label>आपका नाम:</label>
                    <input type="text" id="custName" placeholder="अपना पूरा नाम दर्ज करें" required>
                </div>

                <div class="form-group">
                    <label>मोबाइल / व्हाट्सएप नंबर:</label>
                    <input type="tel" id="custPhone" placeholder="10 अंकों का मोबाइल नंबर" required>
                </div>

                <div class="form-group">
                    <label>आवश्यक विवरण / नोट:</label>
                    <textarea id="custDetails" rows="2" placeholder="आवेदन से जुड़ी आवश्यक जानकारी दर्ज करें..."></textarea>
                </div>

                <div class="payment-section">
                    <p>शुल्क भुगतान करें: <span id="serviceFee" style="color:#0d6efd;">₹0</span></p>
                    <p style="font-size: 11px; color: #666; margin-bottom: 5px;">QR Code को किसी भी UPI App से स्कैन करें:</p>
                    
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=upi://pay?pa=7355719608@axl&pn=CSC_Portal" class="qr-code-img" alt="Scan & Pay QR">
                    
                    <div class="form-group" style="margin-top: 8px;">
                        <label>Transaction / UTR ID भरें:</label>
                        <input type="text" id="paymentTxn" placeholder="12 अंकों की Transaction ID" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> ऑर्डर सबमिट करें</button>
            </form>
        </div>
    </div>

    <!-- फ्लोटिंग व्हाट्सएप बटन -->
    <a href="https://api.whatsapp.com/send?phone=917355719608&text=नमस्ते,%20मुझे%20CSC%20सेवाओं%20के%20बारे%20में%20जानकारी%20चाहिए।" target="_blank" class="whatsapp-float">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <footer>

            { name: "बस टिकट बुकिंग", fee: 50, icon: "fa-bus", desc: "प्राइवेट और सरकारी बसों की टिकट बुकिंग।" },
            { name: "फ्लाईट टिकट बुकिंग", fee: 150, icon: "fa-plane", desc: "घरेलू और अंतरराष्ट्रीय उड़ान टिकट।" },
            { name: "पुलिस कैरेक्टर सर्टिफिकेट", fee: 150, icon: "fa-user-shield", desc: "पुलिस सत्यापन प्रमाण पत्र ऑनलाइन आवेदन।" },
            { name: "लेबर रजिस्ट्रेशन (श्रम विभाग)", fee: 100, icon: "fa-hammer", desc: "भवन निर्माण और अन्य कामगार पंजीकरण।" },
            { name: "डिजीलोकर सहायता", fee: 30, icon: "fa-folder-open", desc: "डिजिटल डॉक्यूमेंट्स डाउनलोड और सेटअप।" }
        ];

        document.addEventListener("DOMContentLoaded", function() {
            displayServices(servicesList);
        });

        function displayServices(list) {
            let gridContainer = document.getElementById('serviceGridContainer');
            if (!gridContainer) return;
            gridContainer.innerHTML = "";

            list.forEach(service => {
                let card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <i class="fa-solid ${service.icon} service-icon"></i>
                    <h3>${service.name}</h3>
                    <p>${service.desc}</p>
                    <button class="btn-card" onclick="openOrderForm('${service.name}', ${service.fee})">आवेदन करें (₹${service.fee})</button>
                `;
                gridContainer.appendChild(card);
            });
        }

        function openOrderForm(serviceName, fee) {
            document.getElementById('selectedService').value = serviceName;
            document.getElementById('serviceFee').innerText = '₹' + fee;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderForm() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function submitToGoogleSheet(e) {
            e.preventDefault();
            
            let name = document.getElementById('custName').value;
            let phone = document.getElementById('custPhone').value;
            let service = document.getElementById('selectedService').value;
            let txn = document.getElementById('paymentTxn').value;
            let details = document.getElementById('custDetails').value;
            let fee = document.getElementById('serviceFee').innerText;

            let googleSheetURL = "https://script.google.com/macros/s/AKfycbykOCtwCP6zNHm6vQbM_kB8FLVNZovcpzdyq2_vYid_95SV2foBE8m125kAqkyxda0p/exec";

            let orderData = {
                service: service,
                name: name,
                phone: phone,
                details: details,
                txn_id: txn
            };

            fetch(googleSheetURL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderData)
            }).catch(err => console.log("Error:", err));

            let myNumber = "917355719608"; 
            let message = "नया ऑर्डर प्राप्त हुआ है!%0A%0A" +
                          "*सर्विस:* " + encodeURIComponent(service) + "%0A" +
                          "*राशि:* " + encodeURIComponent(fee) + "%0A" +
                          "*ग्राहक नाम:* " + encodeURIComponent(name) + "%0A" +
                          "*मोबाइल:* " + encodeURIComponent(phone) + "%0A" +
                          "*विवरण:* " + encodeURIComponent(details) + "%0A" +
                          "*Txn ID:* " + encodeURIComponent(txn);

            let whatsappURL = "https://api.whatsapp.com/send?phone=" + myNumber + "&text=" + message;

            alert("आपका ऑर्डर सबमिट हो गया है! व्हाट्सएप पर रीडायरेक्ट किया जा रहा है...");
            window.location.href = whatsappURL;

            document.getElementById('orderForm').reset();
            closeOrderForm();
        }

        function searchService() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let filteredList = servicesList.filter(service => 
                service.name.toLowerCase().includes(input) || service.desc.toLowerCase().includes(input)
            );
            displayServices(filteredList);
        }
    </script>
</body>
</html>
